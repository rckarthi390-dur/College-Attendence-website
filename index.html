  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, createContext, useContext } = React;

    // ── Seed Data & Database Layer ──────────────────────────────────────
    const SEED_DATA = {
      settings: {
        attendanceThreshold: 75,
        institutionName: "G.T.N. Arts College",
        academicYear: "2024-25",
        lateMarkWindow: 30,
      },
      users: [
        { id: "admin-karthi", name: "karthi", email: "karthi@gmail.com", password: "karthi1234", role: "admin", department: "Administration", phone: "9876543219" }
      ],
      departments: [
        { id: "dept-cs", name: "Computer Science", code: "CS", hod: "" },
        { id: "dept-ec", name: "Electronics", code: "EC", hod: "" },
      ],
      courses: [
        { id: "CS101", name: "Data Structures & Algorithms", code: "CS101", department: "Computer Science", credits: 4, faculty: "" },
        { id: "CS201", name: "Operating Systems", code: "CS201", department: "Computer Science", credits: 4, faculty: "" },
        { id: "CS301", name: "Database Management Systems", code: "CS301", department: "Computer Science", credits: 3, faculty: "" },
        { id: "EC101", name: "Digital Electronics", code: "EC101", department: "Electronics", credits: 4, faculty: "" },
      ],
      attendance: [],
      auditLog: [],
      leaves: []
    };

    const DEMO_USER_IDS = ['admin-001', 'admin-002', 'fac-001', 'fac-002', 'fac-003', 'fac-004', 'fac-005', 'stu-001', 'stu-002', 'stu-003', 'stu-004', 'stu-005', 'stu-006', 'stu-007', 'stu-008', 'stu-009', 'stu-010'];
    const DEMO_EMAILS = [
      'admin@college.edu', 'priya.admin@college.edu', 'anand@college.edu', 'meena@college.edu',
      'suresh@college.edu', 'kavitha@college.edu', 'raman@college.edu', 'arjun@student.edu',
      'priya.s@student.edu', 'rahul@student.edu', 'deepa@student.edu', 'karthik@student.edu',
      'ananya@student.edu', 'vishnu@student.edu', 'lakshmi@student.edu', 'arun@student.edu', 'sneha@student.edu'
    ];

    const API_BASE = 'https://college-attendence-website.onrender.com/api';

    // Helper to get or fetch token for background cloud sync
    async function getOrFetchCloudToken(role = 'admin') {
      let token = localStorage.getItem('college_auth_token');
      if (!token) {
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: 'karthi@gmail.com', password: 'karthi1234' })
          });
          if (res.ok) {
            const data = await res.json();
            token = data.token;
            if (token) localStorage.setItem('college_auth_token', token);
          }
        } catch (e) {
          // Cloud backend might be offline or sleeping
        }
      }
      return token;
    }

    const STORAGE_KEY = 'college_attendance_db';
    function loadDB() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && Array.isArray(parsed.users)) {
            // Remove only dummy demo accounts
            parsed.users = parsed.users.filter(u => {
              if (DEMO_USER_IDS.includes(u.id)) return false;
              if (u.email && DEMO_EMAILS.includes(u.email.toLowerCase())) return false;
              return true;
            });
            // Ensure primary Admin Karthi exists
            const karthiAdmin = { id: "admin-karthi", name: "karthi", email: "karthi@gmail.com", password: "karthi1234", role: "admin", department: "Administration", phone: "9876543219" };
            const karthiIdx = parsed.users.findIndex(u => u.id === 'admin-karthi' && u.role === 'admin');
            if (karthiIdx === -1) {
              parsed.users.unshift(karthiAdmin);
            } else {
              parsed.users[karthiIdx] = { ...parsed.users[karthiIdx], ...karthiAdmin };
            }
            if (Array.isArray(parsed.departments)) {
              parsed.departments = parsed.departments.filter(d => d.name !== 'Administration');
            }
            if (parsed.settings) {
              parsed.settings.institutionName = "G.T.N. Arts College";
              delete parsed.settings.estdYear;
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            return parsed;
          }
        }
      } catch (e) {}
      const initial = JSON.parse(JSON.stringify(SEED_DATA));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
      return initial;
    }
    function saveDB(db) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    function parseDobParts(str) {
      if (!str) return null;
      const clean = str.trim();
      
      // 1. Check YYYY-MM-DD or YYYY/MM/DD or YYYY.MM.DD
      let m = clean.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
      if (m) {
        return { y: Number(m[1]), m: Number(m[2]), d: Number(m[3]) };
      }

      // 2. Check DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY (also supports 2-digit year YY)
      m = clean.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
      if (m) {
        let yr = Number(m[3]);
        const year = yr < 100 ? (yr > 50 ? 1900 + yr : 2000 + yr) : yr;
        return { y: year, m: Number(m[2]), d: Number(m[1]) };
      }

      // 3. Digits only: DDMMYYYY or DDMMYY or YYYYMMDD
      const digits = clean.replace(/\D/g, '');
      if (digits.length === 8) {
        if (digits.startsWith('19') || digits.startsWith('20')) {
          return { y: Number(digits.slice(0, 4)), m: Number(digits.slice(4, 6)), d: Number(digits.slice(6, 8)) };
        } else {
          return { y: Number(digits.slice(4, 8)), m: Number(digits.slice(2, 4)), d: Number(digits.slice(0, 2)) };
        }
      } else if (digits.length === 6) {
        let yr = Number(digits.slice(4, 6));
        const year = yr < 100 ? (yr > 50 ? 1900 + yr : 2000 + yr) : yr;
        return { y: year, m: Number(digits.slice(2, 4)), d: Number(digits.slice(0, 2)) };
      }

      return null;
    }

    function isDobMatch(storedDob, inputDob) {
      if (!storedDob || !inputDob) return true;
      const s = parseDobParts(storedDob);
      const i = parseDobParts(inputDob);
      if (s && i) {
        if (s.y === i.y && s.m === i.m && s.d === i.d) return true;
        if (s.y === i.y && s.m === i.d && s.d === i.m) return true;
      }
      const rawS = (storedDob || '').replace(/\D/g, '');
      const rawI = (inputDob || '').replace(/\D/g, '');
      if (rawS && rawI && rawS === rawI) return true;
      return normalizeDob(storedDob) === normalizeDob(inputDob);
    }

    function normalizeDob(str) {
      if (!str) return '';
      const clean = str.trim().replace(/\s+/g, '');
      const ddmmyyyy = clean.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
      if (ddmmyyyy) {
        const day = ddmmyyyy[1].padStart(2, '0');
        const month = ddmmyyyy[2].padStart(2, '0');
        const year = ddmmyyyy[3];
        return `${year}-${month}-${day}`;
      }
      const yyyymmdd = clean.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
      if (yyyymmdd) {
        const year = yyyymmdd[1];
        const month = yyyymmdd[2].padStart(2, '0');
        const day = yyyymmdd[3].padStart(2, '0');
        return `${year}-${month}-${day}`;
      }
      if (/^\d{8}$/.test(clean)) {
        if (clean.startsWith('19') || clean.startsWith('20')) {
          return `${clean.slice(0, 4)}-${clean.slice(4, 6)}-${clean.slice(6, 8)}`;
        } else {
          return `${clean.slice(4, 8)}-${clean.slice(2, 4)}-${clean.slice(0, 2)}`;
        }
      }
      return clean;
    }

    function formatDobDisplay(str) {
      if (!str) return '01/01/2004';
      const p = parseDobParts(str);
      if (p) {
        return `${String(p.d).padStart(2, '0')}/${String(p.m).padStart(2, '0')}/${p.y}`;
      }
      return str;
    }

    // ── Context Providers ────────────────────────────────────────────────
    const AuthContext = createContext(null);
    const AppContext = createContext(null);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(() => {
        try {
          const stored = localStorage.getItem('college_auth_user');
          return stored ? JSON.parse(stored) : null;
        } catch { return null; }
      });

      const login = async (email, password) => {
        const query = (email || '').toLowerCase().trim();
        const inputPwd = (password || '').trim();

        // 1. Check Local DB first
        const db = loadDB();
        const found = db.users.find(u => (u.email && u.email.toLowerCase() === query) || (u.name && u.name.toLowerCase() === query));
        if (found) {
          if (found.password && found.password.trim() !== inputPwd) {
            throw new Error('Invalid password for this account.');
          }
          const { password: _p, ...safe } = found;
          setUser(safe);
          localStorage.setItem('college_auth_user', JSON.stringify(safe));
          return safe;
        }

        // 2. Try Live Cloud Login
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: query, password: inputPwd })
          });
          if (res.ok) {
            const data = await res.json();
            setUser(data.user);
            localStorage.setItem('college_auth_user', JSON.stringify(data.user));
            localStorage.setItem('college_auth_token', data.token);
            return data.user;
          }
        } catch (err) {
          console.warn('Live cloud login fallback to local DB:', err);
        }

        throw new Error('User not found with this email or username.');
      };

      const loginStudent = async (rollNumber, dob) => {
        const query = (rollNumber || '').trim().toUpperCase();
        const inputDob = (dob || '').trim();
        if (!query) throw new Error('Please enter your Student Roll / Register Number.');
        if (!inputDob) throw new Error('Please enter your Date of Birth (DD/MM/YYYY).');

        // 1. Check Local DB first
        const db = loadDB();
        const localStudent = (db.users || []).find(u => 
          (u.role === 'student') && 
          ((u.rollNumber && u.rollNumber.trim().toUpperCase() === query) ||
           (u.email && u.email.trim().toUpperCase() === query) ||
           (u.name && u.name.trim().toUpperCase() === query) ||
           (u.id && u.id.trim().toUpperCase() === query))
        );

        if (localStudent) {
          if (localStudent.dob && localStudent.dob.trim()) {
            if (!isDobMatch(localStudent.dob, inputDob)) {
              const sParts = parseDobParts(localStudent.dob);
              const formattedDob = sParts ? `${String(sParts.d).padStart(2, '0')}/${String(sParts.m).padStart(2, '0')}/${sParts.y}` : localStudent.dob;
              throw new Error(`Date of Birth does not match records for Roll No "${query}". Registered DOB is ${formattedDob}.`);
            }
          }
          const { password: _p, ...safe } = localStudent;
          setUser(safe);
          localStorage.setItem('college_auth_user', JSON.stringify(safe));
          return safe;
        }

        // 2. If not found in local DB, try Live Cloud Student Login
        try {
          const res = await fetch(`${API_BASE}/auth/student-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rollNumber: query, dob: inputDob })
          });
          if (res.ok) {
            const data = await res.json();
            setUser(data.user);
            localStorage.setItem('college_auth_user', JSON.stringify(data.user));
            localStorage.setItem('college_auth_token', data.token);
            return data.user;
          } else {
            const errData = await res.json().catch(() => ({}));
            if (errData.error) throw new Error(errData.error);
          }
        } catch (err) {
          if (err.message && err.message.includes('Date of Birth')) throw err;
          console.warn('Cloud student login fallback to local DB:', err);
        }

        throw new Error(`No student found with Roll / Register Number "${query}". Please check your Roll Number.`);
      };

      const demoLogin = async (role) => {
        // 1. Try Live Cloud Demo Login
        try {
          const res = await fetch(`${API_BASE}/auth/demo-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role })
          });
          if (res.ok) {
            const data = await res.json();
            setUser(data.user);
            localStorage.setItem('college_auth_user', JSON.stringify(data.user));
            localStorage.setItem('college_auth_token', data.token);
            return data.user;
          }
        } catch (err) {
          console.warn('Live cloud demo login fallback to local DB:', err);
        }

        // 2. Fallback to Local DB
        const roleMap = { admin: 'karthi@gmail.com', faculty: 'anand@college.edu', student: 'arjun@student.edu' };
        const db = loadDB();
        const found = db.users.find(u => u.email === roleMap[role]) || db.users.find(u => u.role === role);
        if (!found) throw new Error('Demo user not found.');
        const { password: _p, ...safe } = found;
        setUser(safe);
        localStorage.setItem('college_auth_user', JSON.stringify(safe));
        return safe;
      };

      const logout = () => {
        setUser(null);
        localStorage.removeItem('college_auth_user');
        localStorage.removeItem('college_auth_token');
      };

      return <AuthContext.Provider value={{ user, login, loginStudent, loginByRollNumber: loginStudent, demoLogin, logout }}>{children}</AuthContext.Provider>;
    }

    function AppProvider({ children }) {
      const [db, setDb] = useState(() => loadDB());
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSync, setLastSync] = useState(null);

      const updateDB = useCallback((updater) => {
        setDb(prev => {
          const next = updater(JSON.parse(JSON.stringify(prev)));
          saveDB(next);
          return next;
        });
      }, []);

      // Pull latest cloud data across all devices with non-destructive merge
      const syncWithCloud = useCallback(async () => {
        try {
          setIsSyncing(true);
          const token = await getOrFetchCloudToken('admin');
          if (!token) {
            setIsSyncing(false);
            return;
          }
          const headers = { 'Authorization': `Bearer ${token}` };

          const [usersRes, deptsRes, coursesRes, leavesRes, settingsRes, attRes] = await Promise.allSettled([
            fetch(`${API_BASE}/users`, { headers }),
            fetch(`${API_BASE}/departments`, { headers }),
            fetch(`${API_BASE}/courses`, { headers }),
            fetch(`${API_BASE}/leaves`, { headers }),
            fetch(`${API_BASE}/settings`, { headers }),
            fetch(`${API_BASE}/attendance`, { headers })
          ]);

          // Safe non-destructive merge
          updateDB(d => {
            // 1. Merge users
            if (usersRes.status === 'fulfilled' && usersRes.value.ok) {
              usersRes.value.json().then(cloudUsers => {
                if (Array.isArray(cloudUsers) && cloudUsers.length > 0) {
                  updateDB(current => {
                    const existingUserIds = new Set(current.users.map(u => u.id));
                    const existingEmails = new Set(current.users.map(u => (u.email || '').toLowerCase()));
                    let hasNew = false;
                    cloudUsers.forEach(cu => {
                      if (!DEMO_USER_IDS.includes(cu.id) && !DEMO_EMAILS.includes((cu.email || '').toLowerCase())) {
                        if (!existingUserIds.has(cu.id) && (!cu.email || !existingEmails.has(cu.email.toLowerCase()))) {
                          current.users.push(cu);
                          existingUserIds.add(cu.id);
                          hasNew = true;
                        }
                      }
                    });
                    return current;
                  });
                }
              }).catch(() => {});
            }

            // 2. Merge departments
            if (deptsRes.status === 'fulfilled' && deptsRes.value.ok) {
              deptsRes.value.json().then(cloudDepts => {
                if (Array.isArray(cloudDepts)) {
                  updateDB(current => {
                    if (!Array.isArray(current.departments)) current.departments = [];
                    const deptNames = new Set(current.departments.map(x => x.name.toLowerCase()));
                    cloudDepts.forEach(cd => {
                      if (!deptNames.has(cd.name.toLowerCase())) {
                        current.departments.push(cd);
                        deptNames.add(cd.name.toLowerCase());
                      }
                    });
                    return current;
                  });
                }
              }).catch(() => {});
            }

            // 3. Merge courses
            if (coursesRes.status === 'fulfilled' && coursesRes.value.ok) {
              coursesRes.value.json().then(cloudCourses => {
                if (Array.isArray(cloudCourses)) {
                  updateDB(current => {
                    if (!Array.isArray(current.courses)) current.courses = [];
                    const courseCodes = new Set(current.courses.map(c => (c.code || c.id || '').toUpperCase()));
                    cloudCourses.forEach(cc => {
                      const code = (cc.code || cc.id || '').toUpperCase();
                      if (code && !courseCodes.has(code)) {
                        current.courses.push(cc);
                        courseCodes.add(code);
                      }
                    });
                    return current;
                  });
                }
              }).catch(() => {});
            }

            // 4. Merge attendance
            if (attRes.status === 'fulfilled' && attRes.value.ok) {
              attRes.value.json().then(cloudAtt => {
                if (Array.isArray(cloudAtt)) {
                  updateDB(current => {
                    if (!Array.isArray(current.attendance)) current.attendance = [];
                    const attKeys = new Set(current.attendance.map(a => `${a.studentId}_${a.courseId}_${a.date}`));
                    cloudAtt.forEach(ca => {
                      const key = `${ca.studentId}_${ca.courseId}_${ca.date}`;
                      if (!attKeys.has(key)) {
                        current.attendance.push(ca);
                        attKeys.add(key);
                      }
                    });
                    return current;
                  });
                }
              }).catch(() => {});
            }

            // 5. Merge settings
            if (settingsRes.status === 'fulfilled' && settingsRes.value.ok) {
              settingsRes.value.json().then(cloudSettings => {
                if (cloudSettings && cloudSettings.institutionName) {
                  updateDB(current => {
                    current.settings = { ...current.settings, ...cloudSettings };
                    return current;
                  });
                }
              }).catch(() => {});
            }

            return d;
          });

          setLastSync(new Date());
        } catch (err) {
          console.warn('Cloud sync background error:', err);
        } finally {
          setIsSyncing(false);
        }
      }, [updateDB]);

      // Auto-sync periodically, on tab focus & on visibility change (instant multi-device sync)
      useEffect(() => {
        syncWithCloud();
        const interval = setInterval(syncWithCloud, 4000);
        const onVisibility = () => {
          if (!document.hidden) syncWithCloud();
        };
        window.addEventListener('focus', syncWithCloud);
        document.addEventListener('visibilitychange', onVisibility);
        return () => {
          clearInterval(interval);
          window.removeEventListener('focus', syncWithCloud);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, [syncWithCloud]);

      // Users
      const getUsers = (f = {}) => {
        let u = db.users;
        if (f.role) u = u.filter(x => x.role === f.role);
        if (f.department) u = u.filter(x => x.department === f.department);
        return u;
      };

      const addUser = async (data) => {
        const newU = { id: `usr-${Date.now()}`, ...data, createdAt: new Date().toISOString() };
        updateDB(d => { d.users.push(newU); return d; });

        // Save to Render Cloud Database
        try {
          const token = await getOrFetchCloudToken('admin');
          if (token) {
            await fetch(`${API_BASE}/users`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
            setTimeout(syncWithCloud, 800);
          }
        } catch (e) {
          console.warn('Failed to save user to cloud:', e);
        }
      };

      const updateUser = async (id, data) => {
        updateDB(d => { const i = d.users.findIndex(x => x.id === id); if (i >= 0) d.users[i] = { ...d.users[i], ...data }; return d; });
        try {
          const token = await getOrFetchCloudToken('admin');
          if (token) {
            await fetch(`${API_BASE}/users/${id}`, {
              method: 'PUT',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
            setTimeout(syncWithCloud, 800);
          }
        } catch (e) {}
      };

      const deleteUser = async (id) => {
        const u = db.users.find(x => x.id === id);
        if (u && u.id === 'admin-karthi' && u.role === 'admin') {
          alert('Primary Administrator account (admin-karthi) cannot be deleted.');
          return;
        }
        updateDB(d => { d.users = d.users.filter(x => x.id !== id); return d; });
        try {
          const token = await getOrFetchCloudToken('admin');
          if (token) {
            await fetch(`${API_BASE}/users/${id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${token}` }
            });
            setTimeout(syncWithCloud, 800);
          }
        } catch (e) {}
      };

      // Courses & Departments
      const getCourses = (dept) => dept ? db.courses.filter(c => c.department === dept) : db.courses;
      const addCourse = async (data) => {
        const newC = { id: data.code || `CRS-${Date.now()}`, ...data };
        updateDB(d => { d.courses.push(newC); return d; });
        try {
          const token = await getOrFetchCloudToken('admin');
          if (token) {
            await fetch(`${API_BASE}/courses`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
            setTimeout(syncWithCloud, 800);
          }
        } catch (e) {}
      };
      const updateCourse = (id, data) => updateDB(d => { const i = d.courses.findIndex(c => c.id === id); if (i >= 0) d.courses[i] = { ...d.courses[i], ...data }; return d; });
      const deleteCourse = (id) => updateDB(d => { d.courses = d.courses.filter(c => c.id !== id); return d; });

      const getDepartments = () => db.departments || [];
      const addDepartment = (data) => {
        updateDB(d => {
          if (!Array.isArray(d.departments)) d.departments = [];
          d.departments.push({ id: `dept-${Date.now()}`, ...data });
          return d;
        });
        getOrFetchCloudToken('admin').then(token => {
          if (token) {
            fetch(`${API_BASE}/departments`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });
      };
      const updateDepartment = (id, data) => {
        updateDB(d => {
          if (Array.isArray(d.departments)) {
            const idx = d.departments.findIndex(x => x.id === id || x.name === id);
            if (idx >= 0) d.departments[idx] = { ...d.departments[idx], ...data };
          }
          return d;
        });
        getOrFetchCloudToken('admin').then(token => {
          if (token) {
            fetch(`${API_BASE}/departments/${id}`, {
              method: 'PUT',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });
      };
      const deleteDepartment = (id) => {
        updateDB(d => {
          if (Array.isArray(d.departments)) {
            d.departments = d.departments.filter(x => x.id !== id);
          }
          return d;
        });
        getOrFetchCloudToken('admin').then(token => {
          if (token) {
            fetch(`${API_BASE}/departments/${id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${token}` }
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });
      };

      // Roster & Attendance
      const getRoster = (courseId, section, date, dept) => {
        let students = db.users.filter(u => u.role === 'student');
        if (section) {
          students = students.filter(s => !s.section || s.section.toUpperCase() === section.toUpperCase());
        }
        if (dept) {
          students = students.filter(s => !s.department || s.department.toLowerCase() === dept.toLowerCase());
        }
        const existing = db.attendance.filter(a => a.courseId === courseId && a.date === date);
        return students.map(s => {
          const att = existing.find(a => a.studentId === s.id);
          return {
            studentId: s.id,
            name: s.name,
            rollNumber: s.rollNumber,
            section: s.section || 'A',
            status: att ? att.status : 'present',
            originalStatus: att ? att.status : 'present',
            attendanceId: att ? att.id : null
          };
        });
      };

      const saveAttendanceSession = (courseId, date, records, markedBy) => {
        const auditEntries = [];
        updateDB(d => {
          records.forEach(r => {
            const idx = d.attendance.findIndex(a => a.studentId === r.studentId && a.courseId === courseId && a.date === date);
            if (idx >= 0) {
              const old = d.attendance[idx];
              if (old.status !== r.status) {
                const entry = { id: `audit-${Date.now()}-${Math.random()}`, attendanceId: old.id, studentId: r.studentId, courseId, date, oldStatus: old.status, newStatus: r.status, modifiedBy: markedBy, modifiedAt: new Date().toISOString(), reason: r.reason || 'Manual historical update' };
                d.auditLog.push(entry);
                auditEntries.push(entry);
              }
              d.attendance[idx] = { ...old, status: r.status, markedBy, markedAt: new Date().toISOString() };
            } else {
              d.attendance.push({ id: `att-${Date.now()}-${Math.random()}`, studentId: r.studentId, courseId, date, status: r.status, markedBy, markedAt: new Date().toISOString() });
            }
          });
          return d;
        });

        // Cloud sync attendance
        getOrFetchCloudToken('faculty').then(token => {
          if (token) {
            fetch(`${API_BASE}/attendance`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ courseId, date, records, markedBy })
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });

        return { auditEntries };
      };

      const getStudentAttendanceSummary = (studentId) => {
        const student = db.users.find(u => u.id === studentId);
        const recs = db.attendance.filter(a => a.studentId === studentId);
        const threshold = db.settings.attendanceThreshold || 75;
        
        // Show courses for the student's department or all courses
        let studentCourses = db.courses;
        if (student && student.department) {
          const deptCourses = db.courses.filter(c => c.department.toLowerCase() === student.department.toLowerCase());
          if (deptCourses.length > 0) {
            studentCourses = deptCourses;
          }
        }

        const stats = studentCourses.map(course => {
          const cRecs = recs.filter(r => r.courseId === course.id);
          const total = cRecs.length;
          const present = cRecs.filter(r => r.status === 'present' || r.status === 'on-duty').length;
          const percentage = total > 0 ? Math.round((present / total) * 100) : 0;
          return {
            courseId: course.id,
            courseName: course.name,
            courseCode: course.code,
            department: course.department,
            credits: course.credits,
            total,
            present,
            absent: cRecs.filter(r => r.status === 'absent').length,
            late: cRecs.filter(r => r.status === 'late').length,
            onDuty: cRecs.filter(r => r.status === 'on-duty').length,
            percentage,
            isLow: total > 0 && percentage < threshold,
            hasSessions: total > 0
          };
        });

        const totalAll = recs.length;
        const presentAll = recs.filter(r => r.status === 'present' || r.status === 'on-duty').length;
        const overallPercentage = totalAll > 0 ? Math.round((presentAll / totalAll) * 100) : 0;

        const enrichedRecords = recs.map(r => {
          const course = db.courses.find(c => c.id === r.courseId);
          const audits = db.auditLog.filter(a => a.attendanceId === r.id);
          return { ...r, courseName: course?.name || 'Course', courseCode: course?.code || '', wasModified: audits.length > 0 };
        });

        return { records: enrichedRecords, stats, overallPercentage, totalSessions: totalAll };
      };

      const getAuditLog = (f = {}) => {
        let logs = db.auditLog;
        if (f.facultyId) logs = logs.filter(l => l.modifiedBy === f.facultyId);
        if (f.courseId) logs = logs.filter(l => l.courseId === f.courseId);
        return logs.map(l => {
          const fac = db.users.find(u => u.id === l.modifiedBy);
          const stu = db.users.find(u => u.id === l.studentId);
          const crs = db.courses.find(c => c.id === l.courseId);
          return { ...l, facultyName: fac?.name || 'Faculty', studentName: stu?.name || 'Student', rollNumber: stu?.rollNumber || '', courseName: crs?.name || 'Course' };
        }).sort((a,b) => new Date(b.modifiedAt) - new Date(a.modifiedAt));
      };

      const getLeaves = (f = {}) => {
        let l = db.leaves;
        if (f.studentId) l = l.filter(x => x.studentId === f.studentId);
        if (f.status) l = l.filter(x => x.status === f.status);
        return l.map(x => {
          const stu = db.users.find(u => u.id === x.studentId);
          return { ...x, studentName: stu?.name || 'Student', rollNumber: stu?.rollNumber || '' };
        }).sort((a,b) => new Date(b.appliedAt) - new Date(a.appliedAt));
      };

      const addLeave = (studentId, data) => {
        updateDB(d => { d.leaves.push({ id: `leave-${Date.now()}`, studentId, ...data, status: 'pending', appliedAt: new Date().toISOString() }); return d; });
        getOrFetchCloudToken('student').then(token => {
          if (token) {
            fetch(`${API_BASE}/leaves`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ studentId, ...data })
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });
      };

      const reviewLeave = (id, status, reviewerId) => {
        updateDB(d => { const i = d.leaves.findIndex(x => x.id === id); if (i >= 0) d.leaves[i] = { ...d.leaves[i], status, reviewedBy: reviewerId, reviewedAt: new Date().toISOString() }; return d; });
        getOrFetchCloudToken('faculty').then(token => {
          if (token) {
            fetch(`${API_BASE}/leaves/${id}`, {
              method: 'PUT',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ status, reviewerId })
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });
      };

      const deleteLeave = (id) => updateDB(d => { d.leaves = d.leaves.filter(x => x.id !== id); return d; });

      const getSettings = () => db.settings;
      const updateSettings = (data) => {
        updateDB(d => { d.settings = { ...d.settings, ...data }; return d; });
        getOrFetchCloudToken('admin').then(token => {
          if (token) {
            fetch(`${API_BASE}/settings`, {
              method: 'PUT',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });
      };

      return (
        <AppContext.Provider value={{
          db, getUsers, addUser, updateUser, deleteUser,
          getCourses, addCourse, updateCourse, deleteCourse,
          getDepartments, addDepartment, updateDepartment, deleteDepartment,
          getRoster, saveAttendanceSession, getStudentAttendanceSummary,
          getAuditLog, getLeaves, addLeave, reviewLeave, deleteLeave,
          getSettings, updateSettings, syncWithCloud, isSyncing, lastSync
        }}>
          {children}
        </AppContext.Provider>
      );
    }

    const useAuth = () => useContext(AuthContext);
    const useApp = () => useContext(AppContext);

    // ── Components ───────────────────────────────────────────────────────
    function StatusBadge({ status }) {
      const styles = {
        present: 'bg-emerald-100 text-emerald-800 border-emerald-200',
        absent: 'bg-red-100 text-red-800 border-red-200',
        late: 'bg-amber-100 text-amber-800 border-amber-200',
        'on-duty': 'bg-blue-100 text-blue-800 border-blue-200',
        pending: 'bg-slate-100 text-slate-700 border-slate-200',
        approved: 'bg-emerald-100 text-emerald-800 border-emerald-200',
        rejected: 'bg-red-100 text-red-800 border-red-200',
      };
      const labels = { 'on-duty': 'On Duty', present: 'Present', absent: 'Absent', late: 'Late', pending: 'Pending', approved: 'Approved', rejected: 'Rejected' };
      return <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold border ${styles[status] || styles.pending}`}>{labels[status] || status}</span>;
    }

    function PercentageGauge({ value, threshold = 75 }) {
      const isOk = value >= threshold;
      return (
        <div className="relative inline-flex items-center justify-center">
          <div className={`w-24 h-24 rounded-full flex flex-col items-center justify-center border-4 ${isOk ? 'border-emerald-400 bg-emerald-500/10 text-emerald-600' : 'border-red-400 bg-red-500/10 text-red-600'}`}>
            <span className="text-2xl font-black">{value}%</span>
            <span className="text-[10px] font-bold tracking-wider uppercase">{isOk ? 'Passing' : 'Low'}</span>
          </div>
        </div>
      );
    }

    // ── Pages ───────────────────────────────────────────────────────────

      useEffect(() => {
        getOrFetchCloudToken('admin').then(token => {
          if (token) {
            fetch(`${API_BASE}/users`, { headers: { 'Authorization': `Bearer ${token}` } })
              .then(res => res.ok ? res.json() : null)
              .then(cloudUsers => {
                if (Array.isArray(cloudUsers) && cloudUsers.length > 0) {
                  const db = loadDB();
                  const existingIds = new Set(db.users.map(x => x.id));
                  let updated = false;
                  cloudUsers.forEach(cu => {
                    if (!DEMO_USER_IDS.includes(cu.id) && !existingIds.has(cu.id)) {
                      db.users.push(cu);
                      existingIds.add(cu.id);
                      updated = true;
                    }
                  });
                  if (updated) saveDB(db);
                }

          }

        }
        addUser(userData);

        setNewU({
          name: '',
          email: '',
          phone: '',
          role: newU.role,
          rollNumber: '',
          dob: '01/01/2004',
          employeeId: '',
          section: 'A',
          year: 1,
          department: newU.department,
          password: 'password'
        });

      const [editingUser, setEditingUser] = useState(null);

      const handleUpdateUser = (e) => {
        e.preventDefault();
        if (!editingUser) return;
        const updateData = { ...editingUser };
