<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Attendance Management System</title>

  </script>

  <style>
    /* ── Ambient Mesh Gradient & Typography ── */
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                  radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.10) 0px, transparent 50%),
                  radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                  radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                  #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Custom Glass Scrollbars ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.6); }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
      backdrop-filter: blur(4px);
      transition: background 0.2s ease;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.6); }

    /* ── Glassmorphism Core Cards & Surfaces ── */
    .glass-card, .bg-white {
      background: rgba(255, 255, 255, 0.78) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.8) !important;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02) !important;
      border-radius: 1.25rem !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    .glass-card:hover {
      box-shadow: 0 14px 38px rgba(30, 41, 59, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04) !important;
      border-color: rgba(255, 255, 255, 0.95) !important;
    }

    /* ── Dark Glass Sidebar ── */
    .app-sidebar {
      background: rgba(15, 23, 42, 0.92) !important;
      backdrop-filter: blur(24px) saturate(190%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(190%) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.15) !important;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    /* ── Butter-Smooth Buttons ── */
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%) !important;
      color: white !important;
      border-radius: 0.875rem !important;
      padding: 0.625rem 1.25rem !important;
      font-weight: 700 !important;
      font-size: 0.875rem !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35) !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
      cursor: pointer;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #2563eb 0%, #4338ca 100%) !important;
      transform: translateY(-2px) scale(1.01) !important;
      box-shadow: 0 8px 22px rgba(59, 130, 246, 0.45) !important;
    }
    .btn-primary:active {
      transform: translateY(0) scale(0.99) !important;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(8px) !important;
      color: #334155 !important;
      border: 1px solid rgba(203, 213, 225, 0.7) !important;
      border-radius: 0.875rem !important;
      padding: 0.625rem 1.25rem !important;
      font-weight: 700 !important;
      font-size: 0.875rem !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03) !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #ffffff !important;
      border-color: #94a3b8 !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06) !important;
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981 0%, #0d9488 100%) !important;
      color: white !important;
      border-radius: 0.875rem !important;
      padding: 0.625rem 1.25rem !important;
      font-weight: 700 !important;
      font-size: 0.875rem !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3) !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
      cursor: pointer;
    }
    .btn-success:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4) !important;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #e11d48 100%) !important;
      color: white !important;
      border-radius: 0.875rem !important;
      padding: 0.625rem 1.25rem !important;
      font-weight: 700 !important;
      font-size: 0.875rem !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3) !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
      cursor: pointer;
    }
    .btn-danger:hover {
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4) !important;
    }

    /* ── Frosted Input Fields ── */
    .input-field {
      width: 100%;
      border: 1px solid rgba(203, 213, 225, 0.8) !important;
      border-radius: 0.875rem !important;
      padding: 0.65rem 0.95rem !important;
      font-size: 0.875rem !important;
      outline: none !important;
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(10px) !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .input-field:focus {
      border-color: #4f46e5 !important;
      background: #ffffff !important;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18) !important;
      transform: translateY(-1px);
    }

    /* ── Tab Buttons with Smooth Glow ── */
    .tab-nav button {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
      backdrop-filter: blur(8px) !important;
    }
    .tab-nav button:hover {
      transform: translateY(-1.5px) !important;
    }

    /* ── Table & Rows ── */
    .table-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .table-row {
      border-bottom: 1px solid rgba(241, 245, 249, 0.8);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .table-row:hover {
      background: rgba(241, 245, 249, 0.7) !important;
      transform: scale([1.002]);
    }

    /* ── Tab Pane Animations ── */
    .tab-content, .fade-in-slide {
      animation: fadeInSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Mobile Responsive Styles ── */
    .mobile-menu-btn { display: none; }
    .sidebar-overlay { display: none; }

    @media (max-width: 768px) {
      .app-sidebar {
        position: fixed !important;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 50;
        width: 260px !important;
        transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }
      .app-sidebar.open { left: 0; }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        z-index: 40;
        transition: all 0.3s ease;
      }
      .sidebar-overlay.open { display: block; }

      .mobile-menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        font-size: 1.25rem;
        cursor: pointer;
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 35;
        box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .mobile-menu-btn:hover {
        transform: scale(1.05);
      }

      .app-main { padding-top: 60px !important; }
      .app-main > div { padding: 1rem !important; }

      .tab-nav { flex-wrap: wrap !important; gap: 0.375rem !important; }
      .tab-nav button { font-size: 0.65rem !important; padding: 0.375rem 0.625rem !important; white-space: nowrap; }

      .dash-header { flex-direction: column !important; align-items: flex-start !important; gap: 0.75rem !important; }

      .grid-cols-4, .grid-cols-5, .grid-cols-3 { grid-template-columns: 1fr !important; }
      .stat-mini-grid.grid-cols-4 { grid-template-columns: repeat(4, 1fr) !important; }
      .grid.md\\:grid-cols-2 { grid-template-columns: 1fr !important; }
      .grid.md\\:grid-cols-3 { grid-template-columns: 1fr !important; }

      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -0.5rem; padding: 0 0.5rem; }
      .table-wrap table { min-width: 600px; }

      .student-banner { flex-direction: column !important; text-align: center; gap: 1rem !important; padding: 1.25rem !important; }

      form.grid { grid-template-columns: 1fr !important; }
      form .col-span-4 { grid-column: span 1 !important; }

      .leave-card { flex-direction: column !important; align-items: flex-start !important; gap: 0.75rem !important; }
      .leave-card > div:last-child { width: 100%; display: flex; justify-content: flex-start; flex-wrap: wrap; gap: 0.5rem; }

      form.grid-cols-5 { grid-template-columns: 1fr !important; }
      .grid-cols-2 { grid-template-columns: 1fr !important; }
      .grid-cols-3 { grid-template-columns: 1fr !important; }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .grid-cols-4 { grid-template-columns: repeat(2, 1fr) !important; }
      .grid-cols-5 { grid-template-columns: repeat(3, 1fr) !important; }
      .tab-nav { flex-wrap: wrap !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, createContext, useContext } = React;

    // ── Seed Data & Database Layer ──────────────────────────────────────
    const SEED_DATA = {
      settings: {
        attendanceThreshold: 75,
        institutionName: "G.T.N. Arts College",
        academicYear: "2024-25",
        lateMarkWindow: 30,
      },
      users: [
        { id: "admin-karthi", name: "karthi", email: "karthi@gmail.com", password: "karthi1234", role: "admin", department: "Administration", phone: "9876543219" }
      ],
      departments: [
        { id: "dept-cs", name: "Computer Science", code: "CS", hod: "" },
        { id: "dept-ec", name: "Electronics", code: "EC", hod: "" },
      ],
      courses: [
        { id: "CS101", name: "Data Structures & Algorithms", code: "CS101", department: "Computer Science", credits: 4, faculty: "" },
        { id: "CS201", name: "Operating Systems", code: "CS201", department: "Computer Science", credits: 4, faculty: "" },
        { id: "CS301", name: "Database Management Systems", code: "CS301", department: "Computer Science", credits: 3, faculty: "" },
        { id: "EC101", name: "Digital Electronics", code: "EC101", department: "Electronics", credits: 4, faculty: "" },
      ],
      attendance: [],
      auditLog: [],
      leaves: []
    };

    const DEMO_USER_IDS = ['admin-001', 'admin-002', 'fac-001', 'fac-002', 'fac-003', 'fac-004', 'fac-005', 'stu-001', 'stu-002', 'stu-003', 'stu-004', 'stu-005', 'stu-006', 'stu-007', 'stu-008', 'stu-009', 'stu-010'];
    const DEMO_EMAILS = [
      'admin@college.edu', 'priya.admin@college.edu', 'anand@college.edu', 'meena@college.edu',
      'suresh@college.edu', 'kavitha@college.edu', 'raman@college.edu', 'arjun@student.edu',
      'priya.s@student.edu', 'rahul@student.edu', 'deepa@student.edu', 'karthik@student.edu',
      'ananya@student.edu', 'vishnu@student.edu', 'lakshmi@student.edu', 'arun@student.edu', 'sneha@student.edu'
    ];

    const API_BASE = 'https://college-attendence-website.onrender.com/api';

    // Helper to get or fetch token for background cloud sync
    async function getOrFetchCloudToken(role = 'admin') {
      let token = localStorage.getItem('college_auth_token');
      if (!token) {
        try {
          const res = await fetch(`${API_BASE}/auth/demo-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role })
          });
          if (res.ok) {
            const data = await res.json();
            token = data.token;
            localStorage.setItem('college_auth_token', token);
          }
        } catch (e) {
          console.warn('Could not obtain cloud sync token:', e);
        }
      }
      return token;
    }

    const STORAGE_KEY = 'college_attendance_db';
    function loadDB() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && Array.isArray(parsed.users)) {
            // Remove all dummy demo students/staff from stored state
            parsed.users = parsed.users.filter(u => {
              if (DEMO_USER_IDS.includes(u.id)) return false;
              if (u.email && DEMO_EMAILS.includes(u.email.toLowerCase())) return false;
              return true;
            });
            // Ensure primary Admin Karthi exists
            const karthiAdmin = { id: "admin-karthi", name: "karthi", email: "karthi@gmail.com", password: "karthi1234", role: "admin", department: "Administration", phone: "9876543219" };
            const karthiIdx = parsed.users.findIndex(u => (u.email && u.email.toLowerCase() === 'karthi@gmail.com') || u.id === 'admin-karthi');
            if (karthiIdx === -1) {
              parsed.users.unshift(karthiAdmin);
            } else {
              parsed.users[karthiIdx] = { ...parsed.users[karthiIdx], ...karthiAdmin };
            }
            if (Array.isArray(parsed.departments)) {
              parsed.departments = parsed.departments.filter(d => d.name !== 'Administration');
            }
            if (parsed.settings) {
              parsed.settings.institutionName = "G.T.N. Arts College";
              delete parsed.settings.estdYear;
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
            return parsed;
          }
        }
      } catch (e) {}
      const initial = JSON.parse(JSON.stringify(SEED_DATA));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
      return initial;
    }
    function saveDB(db) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    function normalizeDob(str) {
      if (!str) return '';
      const clean = str.trim();
      const ddmmyyyy = clean.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (ddmmyyyy) {
        const day = ddmmyyyy[1].padStart(2, '0');
        const month = ddmmyyyy[2].padStart(2, '0');
        const year = ddmmyyyy[3];
        return `${year}-${month}-${day}`;
      }
      const yyyymmdd = clean.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
      if (yyyymmdd) {
        const year = yyyymmdd[1];
        const month = yyyymmdd[2].padStart(2, '0');
        const day = yyyymmdd[3].padStart(2, '0');
        return `${year}-${month}-${day}`;
      }
      return clean;
    }

    // ── Context Providers ────────────────────────────────────────────────
    const AuthContext = createContext(null);
    const AppContext = createContext(null);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(() => {
        try {
          const stored = localStorage.getItem('college_auth_user');
          return stored ? JSON.parse(stored) : null;
        } catch { return null; }
      });

      const login = async (email, password) => {
        const query = (email || '').toLowerCase().trim();
        const inputPwd = (password || '').trim();

        // 1. Try Live Cloud Login
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: query, password: inputPwd })
          });
          if (res.ok) {
            const data = await res.json();
            setUser(data.user);
            localStorage.setItem('college_auth_user', JSON.stringify(data.user));
            localStorage.setItem('college_auth_token', data.token);
            return data.user;
          }
        } catch (err) {
          console.warn('Live cloud login fallback to local DB:', err);
        }

        // 2. Fallback to Local DB
        const db = loadDB();
        const found = db.users.find(u => (u.email && u.email.toLowerCase() === query) || (u.name && u.name.toLowerCase() === query));
        if (!found) throw new Error('User not found with this email or username.');
        if (found.password && found.password.trim() !== inputPwd) throw new Error('Invalid password.');
        const { password: _p, ...safe } = found;
        setUser(safe);
        localStorage.setItem('college_auth_user', JSON.stringify(safe));
        return safe;
      };

      const loginStudent = async (rollNumber, dob) => {
        const query = (rollNumber || '').trim().toUpperCase();
        const inputDob = (dob || '').trim();
        if (!query) throw new Error('Please enter your Student Roll / Register Number.');
        if (!inputDob) throw new Error('Please enter your Date of Birth in DD/MM/YYYY numbers.');

        // 1. Try Live Cloud student login
        try {
          const res = await fetch(`${API_BASE}/auth/student-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rollNumber: query, dob: inputDob })
          });
          if (res.ok) {
            const data = await res.json();
            setUser(data.user);
            localStorage.setItem('college_auth_user', JSON.stringify(data.user));
            localStorage.setItem('college_auth_token', data.token);
            return data.user;
          } else {
            const errData = await res.json();
            if (errData.error) throw new Error(errData.error);
          }
        } catch (err) {
          if (err.message && (err.message.includes('Date of Birth') || err.message.includes('Student with Roll'))) throw err;
          console.warn('Cloud student login fallback to local DB:', err);
        }

        // 2. Fallback to Local DB
        const db = loadDB();
        const found = db.users.find(u => u.role === 'student' && u.rollNumber && u.rollNumber.trim().toUpperCase() === query);
        if (!found) throw new Error(`No student found with Roll Number "${query}". Please check your Roll Number.`);
        
        if (found.dob && found.dob.trim()) {
          if (normalizeDob(found.dob) !== normalizeDob(inputDob)) {
            throw new Error(`Date of Birth does not match records for Roll No ${query}.`);
          }
        }

        const { password: _p, ...safe } = found;
        setUser(safe);
        localStorage.setItem('college_auth_user', JSON.stringify(safe));
        return safe;
      };

      const demoLogin = async (role) => {
        // 1. Try Live Cloud Demo Login
        try {
          const res = await fetch(`${API_BASE}/auth/demo-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role })
          });
          if (res.ok) {
            const data = await res.json();
            setUser(data.user);
            localStorage.setItem('college_auth_user', JSON.stringify(data.user));
            localStorage.setItem('college_auth_token', data.token);
            return data.user;
          }
        } catch (err) {
          console.warn('Live cloud demo login fallback to local DB:', err);
        }

        // 2. Fallback to Local DB
        const roleMap = { admin: 'karthi@gmail.com', faculty: 'anand@college.edu', student: 'arjun@student.edu' };
        const db = loadDB();
        const found = db.users.find(u => u.email === roleMap[role]) || db.users.find(u => u.role === role);
        if (!found) throw new Error('Demo user not found.');
        const { password: _p, ...safe } = found;
        setUser(safe);
        localStorage.setItem('college_auth_user', JSON.stringify(safe));
        return safe;
      };

      const logout = () => {
        setUser(null);
        localStorage.removeItem('college_auth_user');
        localStorage.removeItem('college_auth_token');
      };

      return <AuthContext.Provider value={{ user, login, loginStudent, loginByRollNumber: loginStudent, demoLogin, logout }}>{children}</AuthContext.Provider>;
    }

    function AppProvider({ children }) {
      const [db, setDb] = useState(() => loadDB());
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSync, setLastSync] = useState(null);

      const updateDB = useCallback((updater) => {
        setDb(prev => {
          const next = updater(JSON.parse(JSON.stringify(prev)));
          saveDB(next);
          return next;
        });
      }, []);

      // Pull latest cloud data across all devices
      const syncWithCloud = useCallback(async () => {
        try {
          setIsSyncing(true);
          const token = await getOrFetchCloudToken('admin');
          if (!token) return;
          const headers = { 'Authorization': `Bearer ${token}` };

          const [usersRes, coursesRes, leavesRes, settingsRes, attRes] = await Promise.allSettled([
            fetch(`${API_BASE}/users`, { headers }),
            fetch(`${API_BASE}/courses`, { headers }),
            fetch(`${API_BASE}/leaves`, { headers }),
            fetch(`${API_BASE}/settings`, { headers }),
            fetch(`${API_BASE}/attendance`, { headers })
          ]);

          const updates = {};
          if (usersRes.status === 'fulfilled' && usersRes.value.ok) {
            const users = await usersRes.value.json();
            if (Array.isArray(users) && users.length > 0) updates.users = users;
          }
          if (coursesRes.status === 'fulfilled' && coursesRes.value.ok) {
            const courses = await coursesRes.value.json();
            if (Array.isArray(courses) && courses.length > 0) updates.courses = courses;
          }
          if (leavesRes.status === 'fulfilled' && leavesRes.value.ok) {
            const leaves = await leavesRes.value.json();
            if (Array.isArray(leaves)) updates.leaves = leaves;
          }
          if (settingsRes.status === 'fulfilled' && settingsRes.value.ok) {
            const settings = await settingsRes.value.json();
            if (settings && settings.institutionName) updates.settings = settings;
          }
          if (attRes.status === 'fulfilled' && attRes.value.ok) {
            const attendance = await attRes.value.json();
            if (Array.isArray(attendance)) updates.attendance = attendance;
          }

          if (Object.keys(updates).length > 0) {
            updateDB(d => ({ ...d, ...updates }));
          }
          setLastSync(new Date());
        } catch (err) {
          console.warn('Cloud sync error:', err);
        } finally {
          setIsSyncing(false);
        }
      }, [updateDB]);

      // Auto-sync periodically, on tab focus & on visibility change (instant multi-device sync)
      useEffect(() => {
        syncWithCloud();
        const interval = setInterval(syncWithCloud, 4000);
        const onVisibility = () => {
          if (!document.hidden) syncWithCloud();
        };
        window.addEventListener('focus', syncWithCloud);
        document.addEventListener('visibilitychange', onVisibility);
        return () => {
          clearInterval(interval);
          window.removeEventListener('focus', syncWithCloud);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, [syncWithCloud]);

      // Users
      const getUsers = (f = {}) => {
        let u = db.users;
        if (f.role) u = u.filter(x => x.role === f.role);
        if (f.department) u = u.filter(x => x.department === f.department);
        return u;
      };

      const addUser = async (data) => {
        const newU = { id: `usr-${Date.now()}`, ...data, createdAt: new Date().toISOString() };
        updateDB(d => { d.users.push(newU); return d; });

        // Save to Render Cloud Database
        try {
          const token = await getOrFetchCloudToken('admin');
          if (token) {
            await fetch(`${API_BASE}/users`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
            setTimeout(syncWithCloud, 800);
          }
        } catch (e) {
          console.warn('Failed to save user to cloud:', e);
        }
      };

      const updateUser = async (id, data) => {
        updateDB(d => { const i = d.users.findIndex(x => x.id === id); if (i >= 0) d.users[i] = { ...d.users[i], ...data }; return d; });
        try {
          const token = await getOrFetchCloudToken('admin');
          if (token) {
            await fetch(`${API_BASE}/users/${id}`, {
              method: 'PUT',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
            setTimeout(syncWithCloud, 800);
          }
        } catch (e) {}
      };

      const deleteUser = async (id) => {
        const u = db.users.find(x => x.id === id);
        if (u && (u.email === 'karthi@gmail.com' || u.email === 'admin@college.edu')) {
          alert('Primary Administrator account cannot be deleted.');
          return;
        }
        updateDB(d => { d.users = d.users.filter(x => x.id !== id); return d; });
        try {
          const token = await getOrFetchCloudToken('admin');
          if (token) {
            await fetch(`${API_BASE}/users/${id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${token}` }
            });
            setTimeout(syncWithCloud, 800);
          }
        } catch (e) {}
      };

      // Courses & Departments
      const getCourses = (dept) => dept ? db.courses.filter(c => c.department === dept) : db.courses;
      const addCourse = async (data) => {
        const newC = { id: data.code || `CRS-${Date.now()}`, ...data };
        updateDB(d => { d.courses.push(newC); return d; });
        try {
          const token = await getOrFetchCloudToken('admin');
          if (token) {
            await fetch(`${API_BASE}/courses`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });
            setTimeout(syncWithCloud, 800);
          }
        } catch (e) {}
      };
      const updateCourse = (id, data) => updateDB(d => { const i = d.courses.findIndex(c => c.id === id); if (i >= 0) d.courses[i] = { ...d.courses[i], ...data }; return d; });
      const deleteCourse = (id) => updateDB(d => { d.courses = d.courses.filter(c => c.id !== id); return d; });

      const getDepartments = () => db.departments;
      const addDepartment = (data) => updateDB(d => { d.departments.push({ id: `dept-${Date.now()}`, ...data }); return d; });
      const deleteDepartment = (id) => updateDB(d => { d.departments = d.departments.filter(x => x.id !== id); return d; });

      // Roster & Attendance
      const getRoster = (courseId, section, date, dept) => {
        let students = db.users.filter(u => u.role === 'student');
        if (section) {
          students = students.filter(s => !s.section || s.section.toUpperCase() === section.toUpperCase());
        }
        if (dept) {
          students = students.filter(s => !s.department || s.department.toLowerCase() === dept.toLowerCase());
        }
        const existing = db.attendance.filter(a => a.courseId === courseId && a.date === date);
        return students.map(s => {
          const att = existing.find(a => a.studentId === s.id);
          return {
            studentId: s.id,
            name: s.name,
            rollNumber: s.rollNumber,
            section: s.section || 'A',
            status: att ? att.status : 'present',
            originalStatus: att ? att.status : 'present',
            attendanceId: att ? att.id : null
          };
        });
      };

      const saveAttendanceSession = (courseId, date, records, markedBy) => {
        const auditEntries = [];
        updateDB(d => {
          records.forEach(r => {
            const idx = d.attendance.findIndex(a => a.studentId === r.studentId && a.courseId === courseId && a.date === date);
            if (idx >= 0) {
              const old = d.attendance[idx];
              if (old.status !== r.status) {
                const entry = { id: `audit-${Date.now()}-${Math.random()}`, attendanceId: old.id, studentId: r.studentId, courseId, date, oldStatus: old.status, newStatus: r.status, modifiedBy: markedBy, modifiedAt: new Date().toISOString(), reason: r.reason || 'Manual historical update' };
                d.auditLog.push(entry);
                auditEntries.push(entry);
              }
              d.attendance[idx] = { ...old, status: r.status, markedBy, markedAt: new Date().toISOString() };
            } else {
              d.attendance.push({ id: `att-${Date.now()}-${Math.random()}`, studentId: r.studentId, courseId, date, status: r.status, markedBy, markedAt: new Date().toISOString() });
            }
          });
          return d;
        });

        // Cloud sync attendance
        getOrFetchCloudToken('faculty').then(token => {
          if (token) {
            fetch(`${API_BASE}/attendance`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ courseId, date, records, markedBy })
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });

        return { auditEntries };
      };

      const getStudentAttendanceSummary = (studentId) => {
        const student = db.users.find(u => u.id === studentId);
        const recs = db.attendance.filter(a => a.studentId === studentId);
        const threshold = db.settings.attendanceThreshold || 75;
        
        // Show courses for the student's department or all courses
        let studentCourses = db.courses;
        if (student && student.department) {
          const deptCourses = db.courses.filter(c => c.department.toLowerCase() === student.department.toLowerCase());
          if (deptCourses.length > 0) {
            studentCourses = deptCourses;
          }
        }

        const stats = studentCourses.map(course => {
          const cRecs = recs.filter(r => r.courseId === course.id);
          const total = cRecs.length;
          const present = cRecs.filter(r => r.status === 'present' || r.status === 'on-duty').length;
          const percentage = total > 0 ? Math.round((present / total) * 100) : 0;
          return {
            courseId: course.id,
            courseName: course.name,
            courseCode: course.code,
            department: course.department,
            credits: course.credits,
            total,
            present,
            absent: cRecs.filter(r => r.status === 'absent').length,
            late: cRecs.filter(r => r.status === 'late').length,
            onDuty: cRecs.filter(r => r.status === 'on-duty').length,
            percentage,
            isLow: total > 0 && percentage < threshold,
            hasSessions: total > 0
          };
        });

        const totalAll = recs.length;
        const presentAll = recs.filter(r => r.status === 'present' || r.status === 'on-duty').length;
        const overallPercentage = totalAll > 0 ? Math.round((presentAll / totalAll) * 100) : 0;

        const enrichedRecords = recs.map(r => {
          const course = db.courses.find(c => c.id === r.courseId);
          const audits = db.auditLog.filter(a => a.attendanceId === r.id);
          return { ...r, courseName: course?.name || 'Course', courseCode: course?.code || '', wasModified: audits.length > 0 };
        });

        return { records: enrichedRecords, stats, overallPercentage, totalSessions: totalAll };
      };

      const getAuditLog = (f = {}) => {
        let logs = db.auditLog;
        if (f.facultyId) logs = logs.filter(l => l.modifiedBy === f.facultyId);
        if (f.courseId) logs = logs.filter(l => l.courseId === f.courseId);
        return logs.map(l => {
          const fac = db.users.find(u => u.id === l.modifiedBy);
          const stu = db.users.find(u => u.id === l.studentId);
          const crs = db.courses.find(c => c.id === l.courseId);
          return { ...l, facultyName: fac?.name || 'Faculty', studentName: stu?.name || 'Student', rollNumber: stu?.rollNumber || '', courseName: crs?.name || 'Course' };
        }).sort((a,b) => new Date(b.modifiedAt) - new Date(a.modifiedAt));
      };

      const getLeaves = (f = {}) => {
        let l = db.leaves;
        if (f.studentId) l = l.filter(x => x.studentId === f.studentId);
        if (f.status) l = l.filter(x => x.status === f.status);
        return l.map(x => {
          const stu = db.users.find(u => u.id === x.studentId);
          return { ...x, studentName: stu?.name || 'Student', rollNumber: stu?.rollNumber || '' };
        }).sort((a,b) => new Date(b.appliedAt) - new Date(a.appliedAt));
      };

      const addLeave = (studentId, data) => {
        updateDB(d => { d.leaves.push({ id: `leave-${Date.now()}`, studentId, ...data, status: 'pending', appliedAt: new Date().toISOString() }); return d; });
        getOrFetchCloudToken('student').then(token => {
          if (token) {
            fetch(`${API_BASE}/leaves`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ studentId, ...data })
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });
      };

      const reviewLeave = (id, status, reviewerId) => {
        updateDB(d => { const i = d.leaves.findIndex(x => x.id === id); if (i >= 0) d.leaves[i] = { ...d.leaves[i], status, reviewedBy: reviewerId, reviewedAt: new Date().toISOString() }; return d; });
        getOrFetchCloudToken('faculty').then(token => {
          if (token) {
            fetch(`${API_BASE}/leaves/${id}`, {
              method: 'PUT',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ status, reviewerId })
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });
      };

      const deleteLeave = (id) => updateDB(d => { d.leaves = d.leaves.filter(x => x.id !== id); return d; });

      const getSettings = () => db.settings;
      const updateSettings = (data) => {
        updateDB(d => { d.settings = { ...d.settings, ...data }; return d; });
        getOrFetchCloudToken('admin').then(token => {
          if (token) {
            fetch(`${API_BASE}/settings`, {
              method: 'PUT',
              headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            }).then(() => setTimeout(syncWithCloud, 800)).catch(() => {});
          }
        });
      };

      return (
        <AppContext.Provider value={{
          db, getUsers, addUser, updateUser, deleteUser,
          getCourses, addCourse, updateCourse, deleteCourse,
          getDepartments, addDepartment, deleteDepartment,
          getRoster, saveAttendanceSession, getStudentAttendanceSummary,
          getAuditLog, getLeaves, addLeave, reviewLeave, deleteLeave,
          getSettings, updateSettings, syncWithCloud, isSyncing, lastSync
        }}>
          {children}
        </AppContext.Provider>
      );
    }

    const useAuth = () => useContext(AuthContext);
    const useApp = () => useContext(AppContext);

    // ── Components ───────────────────────────────────────────────────────
    function StatusBadge({ status }) {
      const styles = {
        present: 'bg-emerald-100 text-emerald-800 border-emerald-200',
        absent: 'bg-red-100 text-red-800 border-red-200',
        late: 'bg-amber-100 text-amber-800 border-amber-200',
        'on-duty': 'bg-blue-100 text-blue-800 border-blue-200',
        pending: 'bg-slate-100 text-slate-700 border-slate-200',
        approved: 'bg-emerald-100 text-emerald-800 border-emerald-200',
        rejected: 'bg-red-100 text-red-800 border-red-200',
      };
      const labels = { 'on-duty': 'On Duty', present: 'Present', absent: 'Absent', late: 'Late', pending: 'Pending', approved: 'Approved', rejected: 'Rejected' };
      return <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold border ${styles[status] || styles.pending}`}>{labels[status] || status}</span>;
    }

    function PercentageGauge({ value, threshold = 75 }) {
      const isOk = value >= threshold;
      return (
        <div className="relative inline-flex items-center justify-center">
          <div className={`w-24 h-24 rounded-full flex flex-col items-center justify-center border-4 ${isOk ? 'border-emerald-400 bg-emerald-500/10 text-emerald-600' : 'border-red-400 bg-red-500/10 text-red-600'}`}>
            <span className="text-2xl font-black">{value}%</span>
            <span className="text-[10px] font-bold tracking-wider uppercase">{isOk ? 'Passing' : 'Low'}</span>
          </div>
        </div>
      );
    }

    function AdminView() {
      const { user } = useAuth();

        e.preventDefault();
        const userData = { ...newU };
        if (userData.role === 'student') {
          userData.year = Number(userData.year) || 1;
        }
        addUser(userData);
        setUserAddedNotice(`User "${userData.name}" (${userData.role.toUpperCase()}) added successfully!`);
        setTimeout(() => setUserAddedNotice(''), 4000);
        setNewU({
          name: '',
          email: '',
          role: newU.role,
          rollNumber: '',
          dob: '2004-01-01',
          employeeId: '',
          section: 'A',
          year: 1,
          department: newU.department,
          password: 'password'
        });
      };

      const [courseAddedNotice, setCourseAddedNotice] = useState('');
      const [settingsSavedNotice, setSettingsSavedNotice] = useState('');
      const facultyUsers = useMemo(() => users.filter(u => u.role === 'faculty'), [users]);
      const [newC, setNewC] = useState({ name: '', code: '', department: 'Computer Science', credits: 4, faculty: '' });

      const handleAddCourse = (e) => {
        e.preventDefault();
        if (!newC.name.trim() || !newC.code.trim()) return;
        const courseData = {
          ...newC,
          code: newC.code.trim().toUpperCase(),
          credits: Number(newC.credits) || 4,
          faculty: newC.faculty || (facultyUsers[0] ? facultyUsers[0].id : 'fac-001')
        };
        addCourse(courseData);
        setCourseAddedNotice(`Course "${courseData.name}" (${courseData.code}) added successfully!`);
        setTimeout(() => setCourseAddedNotice(''), 4000);
        setNewC({ name: '', code: '', department: newC.department || 'Computer Science', credits: 4, faculty: '' });
      };

      // PDF & Report Filter State
      const [pdfRoleFilter, setPdfRoleFilter] = useState('all');
      const [pdfDeptFilter, setPdfDeptFilter] = useState('all');

      // Compute unique department list
      const deptList = useMemo(() => {
        const set = new Set(['Computer Science', 'Electronics', ...departments.map(d => d.name)]);
        users.forEach(u => { if (u.department && u.department !== 'Administration') set.add(u.department); });
        set.delete('Administration');
        return Array.from(set);
      }, [departments, users]);

      // Filtered users according to selected role & department
      const filteredUsers = useMemo(() => {
        return users.filter(u => {
          const matchRole = pdfRoleFilter === 'all' || u.role === pdfRoleFilter;
          const matchDept = pdfDeptFilter === 'all' || u.department === pdfDeptFilter;
          return matchRole && matchDept;
        });
      }, [users, pdfRoleFilter, pdfDeptFilter]);

      const exportAuditCSV = () => {
        const rows = [['Audit ID', 'Timestamp', 'Date', 'Faculty', 'Student', 'Course', 'Old Status', 'New Status', 'Reason']];
        auditLogs.forEach(l => rows.push([l.id, l.modifiedAt, l.date, l.facultyName, l.studentName, l.courseName, l.oldStatus, l.newStatus, l.reason]));
        const csv = rows.map(r => r.join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'master_audit_log.csv'; a.click();
      };

      const exportPDF = () => {

        const doc = new jsPDF();

        doc.setFontSize(16);
        doc.setTextColor(26, 35, 126);

        const deptLabel = pdfDeptFilter === 'all' ? 'All Departments' : pdfDeptFilter;
        doc.text(`Filters Applied: Role = [${roleLabel}] | Department = [${deptLabel}] | Total Records: ${filteredUsers.length}`, 14, 33);

        doc.autoTable({
          startY: 38,

            return [

                      placeholder="e.g. CS402 or EC305"
                      value={newC.code}
                      onChange={e => setNewC({...newC, code: e.target.value.toUpperCase()})}
                      required
                      className="input-field bg-white border-blue-300 focus:border-blue-500 font-mono font-bold"
                    />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">Academic Department *</label>
                    <select
                      value={newC.department}
                      onChange={e => setNewC({...newC, department: e.target.value})}
                      className="input-field bg-white"
                    >
                      {deptList.map(d => (
                        <option key={d} value={d}>{d}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">Course Credits *</label>
                    <select
                      value={newC.credits}
                      onChange={e => setNewC({...newC, credits: Number(e.target.value)})}
                      className="input-field bg-white"
                    >
                      <option value={1}>1 Credit (Lab / Seminar)</option>
                      <option value={2}>2 Credits</option>
                      <option value={3}>3 Credits</option>
                      <option value={4}>4 Credits (Core Theory)</option>
                      <option value={5}>5 Credits</option>
                    </select>
                  </div>

                  <div className="sm:col-span-2">
                    <label className="block text-[11px] font-bold text-emerald-700 mb-1">Assigned Faculty Instructor *</label>
                    <select
                      value={newC.faculty}
                      onChange={e => setNewC({...newC, faculty: e.target.value})}
                      className="input-field bg-white border-emerald-300 focus:border-emerald-500"
                    >
                      <option value="">-- Select Faculty Instructor --</option>
                      {facultyUsers.map(f => (
                        <option key={f.id} value={f.id}>
                          {f.name} ({f.department} · {f.email})
                        </option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="flex justify-end pt-1">
                  <button type="submit" className="btn-primary text-xs px-6 py-2.5 flex items-center gap-1.5 cursor-pointer">
                    <span>➕</span> Create Course
                  </button>
                </div>
              </form>

              {/* Existing Courses Table */}
              <div>
                <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider mb-3">Institutional Courses ({courses.length})</h4>
                <div className="table-wrap"><table className="w-full">
                  <thead className="bg-slate-50">
                    <tr>
                      <th className="px-4 py-2.5 text-left table-header">Code</th>
                      <th className="px-4 py-2.5 text-left table-header">Course Name</th>
                      <th className="px-4 py-2.5 text-left table-header">Department</th>
                      <th className="px-4 py-2.5 text-center table-header">Credits</th>
                      <th className="px-4 py-2.5 text-left table-header">Instructor</th>
                      <th className="px-4 py-2.5 text-right table-header">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {courses.map(c => {
                      const instructor = users.find(u => u.id === c.faculty);
                      return (
                        <tr key={c.id} className="table-row">
                          <td className="px-4 py-3 text-xs font-mono font-bold text-blue-700">
                            <span className="bg-blue-50 text-blue-700 px-2 py-1 rounded border border-blue-200">
                              {c.code || c.id}
                            </span>
                          </td>
                          <td className="px-4 py-3 text-sm font-bold text-slate-800">{c.name}</td>
                          <td className="px-4 py-3 text-xs text-slate-600 font-medium">{c.department}</td>
                          <td className="px-4 py-3 text-xs text-center font-bold text-slate-700">
                            <span className="bg-slate-100 px-2 py-0.5 rounded text-[11px]">{c.credits || 4} Cr</span>
                          </td>
                          <td className="px-4 py-3 text-xs text-slate-700">
                            {instructor ? (
                              <div className="flex items-center gap-1.5">
                                <span className="text-emerald-700 font-bold">👨‍🏫 {instructor.name}</span>
                              </div>
                            ) : (
                              <span className="text-slate-400 italic">Unassigned</span>
                            )}
                          </td>
                          <td className="px-4 py-3 text-right">
                            <button
                              type="button"
                              onClick={() => {
                                if (confirm(`Are you sure you want to remove course "${c.name}" (${c.code || c.id})?`)) {
                                  deleteCourse(c.id);
                                }
                              }}
                              className="text-xs text-red-600 font-bold hover:text-red-800 transition-colors cursor-pointer"
                            >
                              🗑️ Remove
                            </button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table></div>
              </div>
            </div>
          )}

          {tab === 'audit' && (
            <div className="tab-content bg-white glass-card rounded-2xl p-6 border border-slate-100 space-y-4">
              <div className="flex justify-between items-center">
                <h3 className="font-bold text-slate-800 text-sm">System-Wide Master Audit Trail</h3>
                <button onClick={exportAuditCSV} className="btn-secondary text-xs">📥 Export CSV</button>
              </div>
              <div className="table-wrap"><table className="w-full">
                <thead className="bg-slate-50">
                  <tr>
                    <th className="px-4 py-2 text-left table-header">Timestamp</th>
                    <th className="px-4 py-2 text-left table-header">Faculty</th>
                    <th className="px-4 py-2 text-left table-header">Student</th>
                    <th className="px-4 py-2 text-center table-header">Status Change</th>
                    <th className="px-4 py-2 text-left table-header">Reason</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {auditLogs.map(a => (
                    <tr key={a.id} className="table-row">
                      <td className="px-4 py-3 text-xs text-slate-500 font-mono">{new Date(a.modifiedAt).toLocaleString('en-IN')}</td>
                      <td className="px-4 py-3 text-xs font-bold text-slate-700">{a.facultyName}</td>
                      <td className="px-4 py-3 text-xs text-slate-700">{a.studentName}</td>
                      <td className="px-4 py-3 text-center"><StatusBadge status={a.oldStatus} /> → <StatusBadge status={a.newStatus} /></td>
                      <td className="px-4 py-3 text-xs text-slate-600 italic">"{a.reason}"</td>
                    </tr>
                  ))}
                </tbody>
              </table></div>
            </div>
          )}

          {tab === 'settings' && (
            <div className="tab-content space-y-6">
              {/* Institution Settings Card */}
              <div className="bg-white rounded-2xl p-6 border border-slate-100 space-y-5">
                <div className="flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-slate-800 text-base">Institutional Policies & Academic Calendar</h3>
                    <p className="text-xs text-slate-500">Configure current academic year, college identity, and attendance requirements</p>
                  </div>
                  {settingsSavedNotice && (
                    <span className="text-xs font-bold px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full border border-emerald-300 animate-bounce">
                      ✅ {settingsSavedNotice}
                    </span>
                  )}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {/* Academic Year */}
                  <div className="sm:col-span-2 lg:col-span-2 bg-slate-50/80 p-3.5 rounded-xl border border-slate-200">
                    <label className="block text-xs font-bold text-indigo-900 mb-1.5 flex items-center justify-between">
                      <span className="flex items-center gap-1.5">📅 Academic Year *</span>
                      <span className="text-[10px] text-indigo-600 font-bold">Active: {settings.academicYear || '2024-25'}</span>
                    </label>
                    <input
                      type="text"
                      value={settings.academicYear || '2024-25'}
                      onChange={e => {
                        updateSettings({ academicYear: e.target.value });
                        setSettingsSavedNotice(`Academic Year updated to ${e.target.value}`);
                        setTimeout(() => setSettingsSavedNotice(''), 3000);
                      }}
                      placeholder="e.g. 2024-25 or 2025-26"
                      className="input-field bg-white font-mono font-bold text-sm text-indigo-900 border-indigo-200 focus:border-indigo-500 mb-2"
                    />
                    <div className="flex items-center gap-1.5 flex-wrap">
                      <span className="text-[10px] text-slate-500 font-semibold">Quick Select:</span>
                      {['2024-25', '2025-26', '2026-27', '2027-28'].map(yr => (
                        <button
                          type="button"
                          key={yr}
                          onClick={() => {
                            updateSettings({ academicYear: yr });
                            setSettingsSavedNotice(`Academic Year switched to ${yr}!`);
                            setTimeout(() => setSettingsSavedNotice(''), 3000);
                          }}
                          className={`px-2.5 py-0.5 rounded-lg text-[11px] font-bold transition-all cursor-pointer ${
                            settings.academicYear === yr
                              ? 'bg-indigo-600 text-white shadow-sm'
                              : 'bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600'
                          }`}
                        >
                          {yr}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Institution Name */}
                  <div className="bg-slate-50/80 p-3.5 rounded-xl border border-slate-200">
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">🏛️ Institution Name *</label>
                    <input
                      type="text"
                      value={settings.institutionName || 'G.T.N. Arts College'}
                      onChange={e => {
                        updateSettings({ institutionName: e.target.value });
                        setSettingsSavedNotice('Institution name updated');
                        setTimeout(() => setSettingsSavedNotice(''), 3000);
                      }}
                      placeholder="e.g. G.T.N. Arts College"
                      className="input-field bg-white text-sm"
                    />
                  </div>

                  {/* Attendance Threshold */}
                  <div className="bg-slate-50/80 p-3.5 rounded-xl border border-slate-200">
                    <label className="block text-xs font-bold text-slate-700 mb-1.5 flex items-center justify-between">
                      <span>🎯 Attendance Threshold (%)</span>
                      <span className="text-[10px] text-slate-500">{settings.attendanceThreshold}% min</span>
                    </label>
                    <input
                      type="number"
                      min="1"
                      max="100"
                      value={settings.attendanceThreshold || 75}
                      onChange={e => {
                        updateSettings({ attendanceThreshold: Number(e.target.value) });
                        setSettingsSavedNotice(`Threshold set to ${e.target.value}%`);
                        setTimeout(() => setSettingsSavedNotice(''), 3000);
                      }}
                      className="input-field bg-white font-bold text-sm"
                    />
                  </div>
                </div>
              </div>

              {/* Filtered PDF & Report Generator Card */}
              <div className="bg-white rounded-2xl p-6 border border-slate-100 space-y-5">
                <div className="flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-slate-800 text-base">Customized Attendance & Roster PDF Generator</h3>
                    <p className="text-xs text-slate-500">Filter reports specifically by Role, Department, or both before exporting</p>
                  </div>
                  <span className="text-xs font-bold px-3 py-1 bg-blue-50 text-blue-700 rounded-full border border-blue-200">
                    {filteredUsers.length} Matching Records
                  </span>
                </div>

                {/* Filter Controls */}
                <div className="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">Filter by Role</label>
                    <select value={pdfRoleFilter} onChange={e => setPdfRoleFilter(e.target.value)} className="input-field bg-white">
                      <option value="all">🌐 All Roles (Students, Faculty, Admins)</option>
                      <option value="student">🎓 Students Only</option>
                      <option value="faculty">👨‍🏫 Faculty / Staff Only</option>
                      <option value="admin">🛡️ Administrators Only</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">Filter by Department</label>
                    <select value={pdfDeptFilter} onChange={e => setPdfDeptFilter(e.target.value)} className="input-field bg-white">
                      <option value="all">🏢 All Departments</option>
                      {deptList.map(d => (
                        <option key={d} value={d}>{d}</option>
                      ))}
                    </select>
                  </div>
                </div>

                {/* Live Preview of Matching Records */}
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider">Report Preview ({filteredUsers.length} entries)</h4>
                    <div className="flex gap-2">
                      <button onClick={exportFilteredCSV} className="btn-secondary text-xs px-3 py-1.5 flex items-center gap-1.5">
                        <span>📥</span> Export Filtered CSV
                      </button>
                      <button onClick={exportPDF} className="btn-primary text-xs px-4 py-1.5 flex items-center gap-1.5">
                        <span>📄</span> Download Filtered PDF Report
                      </button>
                    </div>
                  </div>

                  <div className="table-wrap border border-slate-100 rounded-xl overflow-hidden max-h-64 overflow-y-auto">
                    <table className="w-full">
                      <thead className="bg-slate-100 sticky top-0">
                        <tr>
                          <th className="px-3 py-2 text-left table-header">ID / Roll No</th>
                          <th className="px-3 py-2 text-left table-header">Name</th>
                          <th className="px-3 py-2 text-left table-header">Role</th>
                          <th className="px-3 py-2 text-left table-header">Department</th>
                          <th className="px-3 py-2 text-right table-header">Attendance %</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 bg-white">
                        {filteredUsers.length === 0 ? (
                          <tr>
                            <td colSpan="5" className="text-center py-6 text-slate-400 text-xs">
                              No records match the selected filters.
                            </td>
                          </tr>
                        ) : (
                          filteredUsers.map(u => {
                            let att = '—';
                            if (u.role === 'student') {
                              const s = getStudentAttendanceSummary(u.id);
                              att = `${s.overallPercentage}%`;
                            }
                            return (
                              <tr key={u.id} className="table-row text-xs">
                                <td className="px-3 py-2 font-mono text-slate-600">{u.rollNumber || u.employeeId || '—'}</td>
                                <td className="px-3 py-2 font-bold text-slate-800">{u.name}</td>
                                <td className="px-3 py-2">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${u.role === 'student' ? 'bg-purple-100 text-purple-700' : u.role === 'faculty' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}`}>
                                    {u.role}
                                  </span>
                                </td>
                                <td className="px-3 py-2 text-slate-600">{u.department}</td>
                                <td className="px-3 py-2 text-right font-bold text-slate-800">{att}</td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Main App Shell
    function App() {
      const { user, logout } = useAuth();
      const [sidebarOpen, setSidebarOpen] = useState(false);
      if (!user) return <LoginPage />;

      return (
        <div className="h-screen w-full bg-slate-50 flex overflow-hidden">
          {/* Mobile Hamburger Button */}
          <button className="mobile-menu-btn" onClick={() => setSidebarOpen(true)}>☰</button>

          {/* Sidebar Overlay (mobile) */}
          <div className={`sidebar-overlay ${sidebarOpen ? 'open' : ''}`} onClick={() => setSidebarOpen(false)} />

          {/* Sidebar */}
          <div className={`app-sidebar w-64 h-screen flex-shrink-0 bg-slate-900 text-white p-5 flex flex-col justify-between overflow-y-auto ${sidebarOpen ? 'open' : ''}`}>
            <div>
              <div className="flex items-center gap-3 mb-8">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-xl font-bold">🎓</div>
                <div>
                  <h2 className="font-extrabold text-sm leading-tight">SVCE Portal</h2>
                  <p className="text-[10px] text-slate-400">Attendance System</p>
                </div>
              </div>

              <div className="p-3 bg-white/5 rounded-xl border border-white/10 mb-6">
                <p className="text-xs font-bold text-white truncate">{user.name}</p>
                <p className="text-[10px] text-slate-400 uppercase font-semibold mt-0.5">{user.role}</p>
              </div>
            </div>

            <button onClick={() => { logout(); setSidebarOpen(false); }} className="w-full py-2.5 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-bold text-slate-300 transition-colors">🚪 Logout</button>
          </div>

          {/* Main View */}
          <div className="app-main flex-1 h-full overflow-y-auto">
            {user.role === 'faculty' && <FacultyView />}
            {user.role === 'student' && <StudentView />}
            {user.role === 'admin' && <AdminView />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AuthProvider>
        <AppProvider>
          <App />
        </AppProvider>
      </AuthProvider>
    );
  </script>
</body>
</html>
